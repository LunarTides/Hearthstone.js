services:
  docs-builder:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - ./:/app
      - docs-dist:/app/dist
    command: >
      sh -c "
        cd /app &&
        bun install &&
        bun run build
      "
    networks:
      - hsjs
networks:
  hsjs:
volumes:
  docs-dist:
    name: docs-dist
